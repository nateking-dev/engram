    type: stated_once
    importance: high
    question: "What is the head-table guest's dietary restriction the chef must brief the line on?"
    expected_answer: "A life-threatening (anaphylaxis-level) shellfish allergy — no shellfish or shellfish stock, and avoid cross-contamination."
    plant_turn: t2
    reference_turns: []
    target_turns: [t2]
    distractor_turns: []
    probe_turn: t37
    expected_status: live
  - id: event-catering-headcount-supersession
    type: supersession
    importance: high
    question: "What is the guaranteed guest count the kitchen should cook to?"
    expected_answer: "215 guests (revised up from the earlier working number of 180)."
    plant_turn: t20
    reference_turns: []
