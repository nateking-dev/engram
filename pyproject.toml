[project]
name = "engram"
version = "0.1.0"
description = "ACT-R declarative memory as a long-horizon retrieval eval (NIAH with interference, decay, and supersession)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "openai>=1.40",
    "anthropic>=0.40",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
